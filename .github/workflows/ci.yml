name: Node.js CI

on:
  push:
    branches: [main, develop, 'feature/**', 'ci/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      SESSION_SECRET: ci-only-secret-not-for-production

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check native module (better-sqlite3)
        run: node -e "require('better-sqlite3')(':memory:').prepare('select 1').get()"

      - name: Syntax check
        run: find src database tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
